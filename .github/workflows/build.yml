name: Build

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

# NOTE: the Hugo/Docsy site lives at the repository root.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve Hugo modules
        run: hugo mod tidy

      - name: Build site
        run: hugo --minify --logLevel warn
