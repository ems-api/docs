baseURL = "https://api-docs.mailwizz.com/"
title = "MailWizz API Docs"
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true

# Hugo Modules: Docsy theme
[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
  [[module.imports]]
    path = "github.com/google/docsy"
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"

[languages]
  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "tango"
    guessSyntax = true

[caches]
  [caches.getjson]
    maxAge = "10m"

[outputs]
  home = ["HTML", "RSS", "print"]
  section = ["HTML", "print"]

[[menu.main]]
  name = "GitHub"
  weight = 10
  url = "https://github.com/ems-api/docs"
  pre = "<i class='fab fa-github'></i>"

[params]
  copyright = "MailWizz"
  privacy_policy = ""

  github_repo = "https://github.com/ems-api/docs"
  github_branch = "main"

  # Docsy: show "Edit this page" link
  github_project_repo = "https://github.com/ems-api/docs"

  # Docsy: enable built-in offline search (Lunr)
  offlineSearch = true

  # Docsy: version selector / archived flags not used (single version)
  version_menu = "Releases"

  [params.ui]
    sidebar_menu_compact = true
    breadcrumb_disable = false
    sidebar_search_disable = false
    navbar_logo = false
    footer_about_enable = false

    [params.ui.feedback]
      enable = false

    [params.ui.readingtime]
      enable = false

[params.links]
  [[params.links.developer]]
    name = "Improve these docs"
    url = "https://github.com/ems-api/docs"
    icon = "fa fa-github"
    desc = "Contribute via GitHub"
